name: Frontend Type check

on:
  pull_request:
    branches:
      - main
jobs:
  type-check:
    runs-on: ubuntu-latest
    container:
      image: node:22
    defaults:
      run:
        working-directory: ./srcs/frontend/transcendence-spa
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run type-check
      -name: Run build
        run: npm run build

