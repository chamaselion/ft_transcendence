name: Enforce PR Review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, reopened]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Direct Push Violation
        if: github.event_name == 'push'
        run: |
          echo "❌ CRITICAL: Direct terminal push bypassed PR workflow!"
          exit 1

      - name: Check for at least 1 approval
        if: github.event_name != 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const approvals = reviews.filter(review => review.state === 'APPROVED');

            if (approvals.length < 1) {
              core.setFailed(`Merge blocked: This PR requires at least 1 approved review.`);
            }

  notify-discord:
    runs-on: ubuntu-latest
    needs: check-reviews
    if: failure()
    steps:
      - name: Send Alert to Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ⚠️ **UNALLOWED COMMIT ATTEMPT DETECTED ON MAIN**
            • **Repository:** `${{ github.repository }}`
            • **Triggered By:** `${{ github.actor }}`
            • **Action Taken:** Direct push to main or unapproved PR merge attempt.
            • **Commit Link:** https://github.com{{ github.repository }}/commit/${{ github.sha }}
