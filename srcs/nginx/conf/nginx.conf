worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Backend upstream. Reachable only inside the docker network.
    # 3001 must match PORT in .env (backend listen port).
    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:8081;
    }

    # ----- HTTP: redirect everything to HTTPS -----
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ----- HTTPS: single entry point -----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers (backend also sets some of these)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Static frontend
        root /usr/share/nginx/html;
        index index.html;

        # API -> backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for wss later)
            proxy_set_header Upgrade $http_upgrade;
        }

        # Health check -> backend
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: serve index.html for client-side routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Porto $scheme;

            # Vite hot-module reload
            proxy_set_header Upgrade $http_upgrade;                                                                   proxy_set_header Connection "upgrade";
            proxy_set_header Connection "upgrade";
        }
    }
}
