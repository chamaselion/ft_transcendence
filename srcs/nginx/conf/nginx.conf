worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Connection header for proxied requests. A hard-coded "upgrade" would be
    # sent on every request, including plain REST calls that never asked to
    # upgrade; this sends it only when the client set an Upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend upstream. Reachable only inside the docker network.
    # 3001 must match PORT in .env (backend listen port).
    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:8081;
    }

    # ----- HTTP: redirect everything to HTTPS -----
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ----- HTTPS: single entry point -----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers (backend also sets some of these)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Static frontend
        root /usr/share/nginx/html;
        index index.html;

        # API -> backend
        location /api/ {
            client_max_body_size 3m;
            proxy_buffering off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Keep idle WebSocket connections open (backend heartbeat keeps them alive)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check -> backend
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: serve index.html for client-side routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite hot-module reload
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
      listen 443 ssl;
      listen [::]:443 ssl;
      server_name s3.localhost;

      # The certificate must cover s3.localhost
      ssl_certificate     /etc/nginx/certs/s3.crt;
      ssl_certificate_key /etc/nginx/certs/s3.key;

      client_max_body_size 0;

      location / {
          proxy_pass http://obj-storage:9000;
      
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
      
          proxy_request_buffering off;
      }

      location = /rustfs/console {
          absolute_redirect off;
          return 301 /rustfs/console/;
      }
      
      location /rustfs/console/ {
          proxy_pass http://obj-storage:9001;
      
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
      }
  }
}
