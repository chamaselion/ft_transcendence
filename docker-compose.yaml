services:

  nginx:
    build: srcs/nginx
    ports:
      - "${HTTPS_HOST_PORT}:443"
      - "${HTTP_HOST_PORT}:80"
    volumes:
      # Frontend static files (edit without rebuilding the image).
      - ./srcs/frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: srcs/backend
    env_file:
      - .env
    volumes:
      - ./.env:/usr/src/app/.env:ro
    # No host port: backend is reachable only through nginx (single entry point).
    expose:
      - "${PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
