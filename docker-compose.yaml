services:
  nginx:
    build: srcs/nginx
    ports:
      - "${HTTPS_HOST_PORT}:443"
      - "${HTTP_HOST_PORT}:80"
    volumes:
      # Frontend static files (edit without rebuilding the image).
      - ./srcs/frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # Placeholder until the real SPA exists. Keeps the service wired into
  # the stack (idles via the Dockerfile keep-alive CMD). nginx still serves
  # the static placeholder page directly for now; once the SPA is ready,
  # this container will build/serve it and nginx will point here.
  frontend:
    build: srcs/frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./srcs/frontend/transcendence-spa/:/app/transcendence-spa
      - frontend_modules:/app/transcendence-spa/node_modules

  backend:
    build: srcs/backend
    env_file:
      - .env
    volumes:
      - ./.env:/usr/src/app/.env:ro
    # No host port: backend is reachable only through nginx (single entry point).
    expose:
      - "${PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  obj-storage:
    image: rustfs/rustfs:1.0.2
    volumes:
      - obj-storage:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=admin123
    command: ["/data"]

volumes:
  postgres-data:
  frontend_modules:
  obj-storage:
