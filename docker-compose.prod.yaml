services:
  nginx:
    build: srcs/nginx
    ports:
      - "${PROD_HTTPS_HOST_PORT:-443}:443"
      - "${PROD_HTTP_HOST_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

  # Production frontend: builds the SPA and serves the static dist from
  # its own nginx on 8081. The main nginx proxies "/" here, exactly like
  # the dev Vite server. No source bind-mounts, so it is immutable.
  frontend:
    build:
      context: srcs/frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "8081"

  backend:
    build: srcs/backend
    env_file:
      - .env
    volumes:
      - ./.env:/usr/src/app/.env:ro
    # No host port: backend is reachable only through nginx (single entry point).
    expose:
      - "${PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  obj-storage-init:
    image: rustfs/rc
    depends_on:
      obj-storage:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        rc alias set storage http://obj-storage:9000 \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"

        attempt=1
        # Abvoid race between obj-storage initialization and bucket creation
        until rc bucket create --ignore-existing "storage/$$S3_BUCKET"; do
          if [ "$$attempt" -ge 30 ]; then
            printf '%s\n' "Storage initialization failed after 30 attempts." >&2
            exit 1
          fi

          printf 'Storage not ready; retrying (%s/30)...\n' "$$attempt"
          attempt=$$((attempt + 1))
          sleep 2
        done
    restart: "no"

  obj-storage:
    image: rustfs/rustfs:1.0.2
    env_file:
      - .env
    volumes:
      - obj-storage:/data
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    command: ["/data"]

volumes:
  postgres-data:
  obj-storage:
